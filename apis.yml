aid: episode-six
name: Episode Six
description: 'Episode Six is a global payment technology company founded in 2015 by John
  Mitchell, Chermaine Hu and Futeh Kao that supplies banks, fintechs and brands with a
  cloud-native card issuing and ledger management platform marketed as TRITIUM. The
  platform is described by the company as an API-first open architecture delivering
  real-time RESTful API processing for credit, debit, prepaid, commercial, installment
  and virtual card programs alongside a parallel ledger supporting virtual accounts,
  revolving credit, installments, loans, interest-bearing and term deposits, multi-currency
  and negative balance accounts. Episode Six operates in 45+ countries with staff in 20
  countries, and states it is a PCI DSS Level 1 Service Provider that is SOC 2 Type II
  audited and uses GDPR as its global data baseline. Its API documentation is published
  at docs.episodesix.com behind an access-code gate, so no public OpenAPI is available.'
