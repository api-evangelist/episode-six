apis:
- aid: episode-six-tritium-platform-api
  name: Episode Six TRITIUM Platform API
  description: 'The TRITIUM platform API is Episode Six''s real-time RESTful interface for
    card issuing, issuer processing and ledger management — card program setup, account and
    ledger operations, transaction processing and product configuration. Episode Six
    markets it as an "API-first open platform architecture" with a "vast, intuitive payments
    API library." The reference is served from docs.episodesix.com, which is gated behind an
    access code obtained through the company''s access-request form, so no OpenAPI, base URL
    or authentication reference is publicly observable.'
  humanURL: https://docs.episodesix.com/
  x-base-url-status: not-published
  x-base-url-note: 'Episode Six does not publish an API base URL on any public page. The
    documentation host docs.episodesix.com 307-redirects every path to /login, so the real
    host is not observable without an access code. Recorded as missing rather than guessed.'
  tags:
  - Payments
  - Card Issuing
  - Issuer Processing
  - Ledger
  properties:
  - type: Documentation
    url: https://docs.episodesix.com/
  - type: DeveloperPortal
    url: https://episodesix.com/platform/developers
  - type: SignUp
    url: https://episodesix.com/access-request
- aid: episode-six-docs-mcp
  name: Episode Six Documentation MCP Server
  description: 'A Model Context Protocol server published by Episode Six on its own
    documentation host at https://docs.episodesix.com/mcp, exposing the TRITIUM developer
    documentation to agents. The endpoint answers a JSON-RPC tools/list with HTTP 401
    invalid_token, and advertises OAuth 2.0 authorization-server metadata (RFC 8414) at
    /.well-known/oauth-authorization-server plus protected-resource metadata (RFC 9728),
    with a single scope of mcp:search, PKCE S256, and dynamic client registration.'
  humanURL: https://docs.episodesix.com/
  baseURL: https://docs.episodesix.com/mcp
  tags:
  - MCP
  - Documentation
  - Agents
  properties:
  - type: MCPServer
    url: mcp/episode-six-mcp.yml
  - type: OAuthScopes
    url: scopes/episode-six-scopes.yml
  - type: Authentication
    url: authentication/episode-six-authentication.yml
